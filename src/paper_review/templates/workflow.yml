# Added by paper-review. All logic lives in the reusable workflow; bump the tag to upgrade.
name: paper-review
on:
  push:
    branches: ["{default_branch}", "agent/**"]
permissions:
  contents: write
jobs:
  review:
    uses: {uses}
    # The build must use the TeX Live version your Overleaf project uses (Overleaf: Menu >
    # Settings > TeX Live version); a newer/older one can break journal classes. Uncomment:
    # with:
    #   texlive_image: texlive/texlive:TL2025-historic
