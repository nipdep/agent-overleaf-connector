[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-review"
version = "0.2.1"
description = "Review-and-revise loop for LaTeX papers: comments, agent edits, redlines, accept/reject, change log."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pymupdf>=1.24",
    "pyyaml>=6",
    "rapidfuzz>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
paper-review = "paper_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paper_review = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
