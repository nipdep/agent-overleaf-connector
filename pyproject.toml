[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-overleaf-connector"
version = "0.9.0"
description = "AI-agent review loop for Overleaf/LaTeX papers: native comments, agent edits, redlines, accept or reject, MCP server (command: olmcp)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "pymupdf>=1.24",
    "pyyaml>=6",
    "rapidfuzz>=3",
]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
dev = ["pytest>=8", "mcp>=2,<3", "tomli>=2; python_version < '3.11'"]

[project.scripts]
olmcp = "olmcp.cli:main"
paper-review = "olmcp.cli:main"  # deprecated alias of olmcp

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
olmcp = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
